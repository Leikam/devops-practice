apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      module: backend
  template:
    metadata:
      name: conv-api
      labels:
        module: backend
    spec:
      containers:
        - name: conv-api
          image: antonlarichev/conv-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: conv-api-volume
              mountPath: /opt/app/uploads
          env:
            - name: AMQP_EXCHANGE
              value: test
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  key: SEED_USERNAME
                  name: rmq-secrets
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SEED_USER_PASSWORD
                  name: rmq-secrets
            - name: AMQP_HOSTNAME
              value: 192.168.194.174
      volumes:
        - name: conv-api-volume
          persistentVolumeClaim:
            claimName: conv-api-storage

